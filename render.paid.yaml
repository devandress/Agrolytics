# Render Blueprint for Agrolytics — https://render.com/docs/blueprint-spec
#
# Deploys the full stack: FastAPI web service, Celery worker, Celery beat,
# managed PostgreSQL (PostGIS enabled by migration 001), and a Key Value (Redis).
#
# Quick start:
#   1. Push this repo to GitHub.
#   2. Render Dashboard → New → Blueprint → select this repo.
#   3. Render reads render.yaml and provisions everything below.
#
# IMPORTANT free-tier caveats (verify against current Render docs/pricing):
#   - Free PostgreSQL instances expire after ~30 days; use a paid plan for real use.
#   - Free web services sleep when idle; background workers/beat may require a paid plan.
#   - Persistent disks attach to ONE service only — so COG rasters written by the
#     worker are NOT visible to the web service. For multi-service raster serving,
#     switch DATA_DIR to S3-compatible object storage (see S3_BUCKET in config).

databases:
  - name: agrolytics-db
    databaseName: agrolytics
    plan: free
    postgresMajorVersion: "15"

services:
  # ── Redis / Key Value (Celery broker + JWT blocklist) ────────────────────────
  - type: keyvalue
    name: agrolytics-redis
    plan: free
    ipAllowList: []          # only reachable from Render services
    maxmemoryPolicy: allkeys-lru

  # ── API (FastAPI / Uvicorn) ──────────────────────────────────────────────────
  - type: web
    name: agrolytics-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main                # production tracks main (develop → render.staging.yaml)
    plan: free
    healthCheckPath: /health
    # Through entrypoint.sh so migrations run — dockerCommand replaces ENTRYPOINT.
    dockerCommand: /app/entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    disk:
      name: agrolytics-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: RUN_MIGRATIONS          # run alembic upgrade head on boot (entrypoint.sh)
        value: "true"
      - key: APP_ENV
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: JWT_SECRET              # auto-generated strong secret
        generateValue: true
      - key: DATABASE_URL_SYNC       # async URL is derived from this in config.py
        fromDatabase:
          name: agrolytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrolytics-redis
          property: connectionString
      - key: CORS_ORIGINS            # Render's free subdomain (matches this service
                                     # name). Confirm/adjust after first deploy if
                                     # Render appended a random suffix; add more
                                     # comma-separated origins for a separate frontend.
        value: https://agrolytics-api.onrender.com
      - key: DEEPSEEK_API_KEY        # set in dashboard (secret)
        sync: false
      - key: SENTRY_DSN              # optional error tracking; set in dashboard
        sync: false
      - key: POSTHOG_KEY             # optional analytics (public project key)
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com

  # ── Celery worker (ingestion + insights + daily DB backup) ───────────────────
  - type: worker
    name: agrolytics-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: starter
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: APP_ENV
        value: production
      - key: SENTRY_DSN
        sync: false
      - key: JWT_SECRET
        fromService:
          type: web
          name: agrolytics-api
          envVarKey: JWT_SECRET
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: agrolytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrolytics-redis
          property: connectionString
      # Backups (app/services/backup.py) — S3-compatible object storage, e.g.
      # Cloudflare R2. Empty = the daily backup task no-ops (logged, not silent).
      - key: BACKUP_S3_ENDPOINT_URL
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY
        sync: false
      - key: BACKUP_S3_SECRET_KEY
        sync: false

  # ── Celery beat (periodic schedule) ──────────────────────────────────────────
  - type: worker
    name: agrolytics-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: starter
    dockerCommand: celery -A app.tasks.celery_app beat --loglevel=info
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: agrolytics-api
          envVarKey: JWT_SECRET
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: agrolytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrolytics-redis
          property: connectionString
