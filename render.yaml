# Render Blueprint for Agrolytics — 100% FREE tier ($0/mes)
# https://render.com/docs/blueprint-spec
#
# Arquitectura gratis:
#   - Web (FastAPI):  Render web service plan free (duerme tras ~15 min sin tráfico;
#                     el primer request lo despierta en ~30-60 s).
#   - Postgres:       Supabase free (NO expira, a diferencia del Postgres free de
#                     Render que muere a los 30 días). Se pega como env var.
#   - Redis:          Render Key Value plan free (25 MB) — JWT blocklist / rate limit.
#   - Celery worker/beat: NO desplegados (en Render los workers son de pago).
#                     La ingesta satelital se dispara manualmente vía API o local.
#   - Disco persistente: NO (requiere plan pago). Los rasters COG viven en el
#                     filesystem efímero (/app/data se pierde en cada deploy/restart).
#   - Backups de BD:  NO automáticos aquí (la tarea vive en Celery beat, que no
#                     corre en este blueprint). Supabase free tampoco los da.
#                     Mientras tanto: `docker compose exec api python -m
#                     app.services.backup` a mano de vez en cuando, o pasar a
#                     render.paid.yaml (ya trae worker+beat con el backup diario
#                     agendado) en cuanto haya clientes pagando de verdad.
#
# Pasos:
#   1. Crea proyecto en https://supabase.com (gratis). Copia la connection string
#      "Session pooler" (Settings → Database → Connect).
#   2. Render Dashboard → New → Blueprint → selecciona este repo.
#   3. Cuando pida DATABASE_URL_SYNC, pega la URL de Supabase
#      (postgresql://postgres.xxxx:PASSWORD@aws-0-xx.pooler.supabase.com:5432/postgres).
#   4. Deploy. Las migraciones corren solas en el boot (RUN_MIGRATIONS=true).
#
# Para escalar a la versión paga (workers Celery + disco): usar render.paid.yaml.

services:
  # ── Redis / Key Value (free, 25 MB) ─────────────────────────────────────────
  - type: keyvalue
    name: agrolytics-redis
    plan: free
    ipAllowList: []          # only reachable from Render services
    maxmemoryPolicy: allkeys-lru

  # ── API (FastAPI / Uvicorn) ──────────────────────────────────────────────────
  - type: web
    name: agrolytics-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: free
    healthCheckPath: /health
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    envVars:
      - key: RUN_MIGRATIONS          # run alembic upgrade head on boot (entrypoint.sh)
        value: "true"
      - key: APP_ENV
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: JWT_SECRET              # auto-generated strong secret
        generateValue: true
      - key: DATABASE_URL_SYNC       # Supabase pooler URL — pegar en el dashboard.
        sync: false                  # (async URL se deriva sola en config.py)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agrolytics-redis
          property: connectionString
      - key: DATA_DIR                # efímero en plan free (sin disco persistente)
        value: /app/data
      - key: CORS_ORIGINS            # ajustar tras el primer deploy si Render
                                     # añade sufijo aleatorio al subdominio.
        value: https://agrolytics-api.onrender.com
      - key: DEEPSEEK_API_KEY        # set in dashboard (secret)
        sync: false
      - key: SENTRY_DSN              # optional error tracking; set in dashboard
        sync: false
      - key: POSTHOG_KEY             # optional analytics (public project key)
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
