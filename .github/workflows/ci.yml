name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrolytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agrolytics
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/agrolytics
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (GDAL/GEOS/PROJ for rasterio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
