; Static type checking for the FastAPI backend.
; Run:  mypy app
;
; Deliberately NOT --strict repo-wide: app/ predates type checking and a global
; strict pass drowns real findings in legacy noise. The gate is "changed files
; type-clean", enforced per-file, and strictness is ratcheted up module by module
; in [mypy-app.*] blocks below as each one is cleaned.

[mypy]
python_version = 3.11
files = app
namespace_packages = True
explicit_package_bases = True

; Signal we want everywhere, cheap to satisfy.
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
no_implicit_optional = True
check_untyped_defs = True

; Not yet: turning these on globally is the ratchet's end state, not its start.
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False

; Keep output readable and actionable.
pretty = True
show_error_codes = True
show_column_numbers = True

; Third-party packages without bundled stubs.
[mypy-rasterio.*]
ignore_missing_imports = True

[mypy-osgeo.*]
ignore_missing_imports = True

[mypy-shapely.*]
ignore_missing_imports = True

[mypy-geopandas.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True

[mypy-mercadopago.*]
ignore_missing_imports = True

; Migrations are generated/hand-written Alembic scripts; not worth typing.
[mypy-migrations.*]
ignore_errors = True
